# How each code is reached on a machine.  The committed values are what a fresh Linux host needs; copy this file to
# bench.local.toml (not committed) to change them for one machine, its values win.  Nothing else in the repository holds a
# machine path.  bench.local.example.toml shows the settings of a Windows workstation with WSL.
#
#   platform  docker | conda | wsl | windows | linux | archived | skip
#               docker    the worker runs in the validation image (docker/Dockerfile); Docker is in WSL when the runner is on Windows
#               conda     the worker runs in the conda environment `conda_env` of this Linux machine (envs/NAME.yml; setup/install_envs.sh)
#               wsl       the runner is on Windows: the worker runs in `conda_env` of the WSL distribution [wsl].distro
#               windows   native Windows: `python` is the interpreter, executables come from `env`
#               linux     the worker runs in the Python that runs the runner
#               archived  the code cannot run here (licence, build); the frozen result in reviews/*/evidence/ is the reference
#               skip      not used on this machine
#   python    interpreter: windows/linux platforms, or the one inside the image (docker) that has the code
#   env       extra environment variables of the worker (paths of executables and Julia projects)
#   timeout   seconds per job
#   repos     git trees whose commit and dirty state are archived with a campaign

platform = "docker"

[docker]
image = "slipstream-validation:local"
gpus = false          # true adds --gpus all; accuracy cases do not need it, the timing cases do
threads = 1           # OMP/MKL/torch threads per worker; the paper's protocol is one thread
wsl_distro = ""       # the runner is on Windows and Docker is in this WSL distribution (Ubuntu-22.04); empty: docker is on this machine
user = ""             # uid:gid the worker runs as; empty: the runner's on Linux, root through WSL
runs = ""             # where campaigns are written; empty: results/ of this repository

[wsl]
distro = "Ubuntu-22.04"
conda_base = "~/miniforge3"

[conda]
base = "~/miniforge3"

[paths]
slipstream = ""       # checkout of Slipstream to test; required by the image (the repository is private, so the image cannot clone it)

# ---- in the base image (simcodes: ASTRA, elegant, Xsuite, Cheetah, Ocelot)
[codes.slipstream]
probe = "py:slipstream"

[codes.elegant]
probe = "exe:elegant"
# the paper cites elegant 2026.3.0; the image builds 2026.1.0.  Results record the version they came from.

[codes.astra]
probe = "exe:Astra"

[codes.ocelot]
probe = "py:ocelot"
env = { OCELOT_NUM_THREADS = "1" }
timeout = 3600

[codes.cheetah]
probe = "py:cheetah"
timeout = 7200   # drift_kick_drift is a Python loop per element: minutes per call

[codes.xsuite]
probe = "py:xtrack"     # CPU in the image; the GPU rows of the paper need cupy: envs/xsuite-gpu.yml, platform = "conda" (or "wsl") on a GPU host
timeout = 3600          # the first CUDA process spends ~400 s in nvrtc

# ---- the rest of the stack: conda environments from envs/*.yml, installed in the extended image (docker/Dockerfile)
[codes.scibmad]
python = "/opt/envs/scibmad/bin/python"
env = { BENCH_SCIBMAD_JULIA = "/opt/envs/scibmad/libexec/scibmad/bin/julia" }
timeout = 3600

[codes.bmadx]
python = "/opt/envs/bmadx/bin/python"
timeout = 7200          # sextupole steps are a Python loop

[codes.helix]
python = "/opt/envs/helix/bin/python"

# ---- archived on a Linux host for now (they run on the workstation: bench.local.toml sets their platform)
[codes.jutrack]
platform = "archived"
note = "Enzyme, a JuTrack dependency, does not precompile with Julia 1.10.4 or 1.10.10 on Linux/WSL (`Missing Julia object for global`, 8 November 2026); it runs on Windows with Julia 1.10.4. setup/julia.sh and setup/jutrack.sh are the recipe to retry"
env = { BENCH_JULIA = "~/julia-1.10.4/bin/julia", BENCH_JUTRACK = "~/JuTrack.jl" }
timeout = 7200

[codes.impactx]
platform = "archived"
note = "the sc_drift worker needs beam.at_fixed_t(), which is in ImpactX after the 26.10 release (commit 256c808f); conda-forge's 26.10 lacks it. The paper's run is a source build at e4279a4b (26.10 plus 20 commits). Use envs/impactx.yml once a release has it, or build the source"
python = "/opt/envs/impactx/bin/python"
timeout = 7200

# ---- OPAL-X (IPPL + Kokkos): not in the image.  The official CPU image is Ubuntu 24.04 (glibc 2.39) and the validation image is AlmaLinux 9 (2.34), so its
# binary cannot be copied in; the GPU needs a CUDA source build.  `bash setup/install_opalx.sh` builds and pulls them on a Linux host or in WSL; then set
# platform = "wsl" (or "linux"), conda_env, and BENCH_OPALX_CUDA_EXE / BENCH_OPALX_CPU_EXE in bench.local.toml.  The gpu rungs also need [docker] gpus = true.
[codes.opalx]
platform = "skip"
note = "run it on a host that has an OPAL-X build or docker: see setup/install_opalx.sh and reviews/benchmark/codes/CODES.md"
timeout = 7200

# ---- licensed: the user installs it; the frozen result is the reference until then
[codes.gpt]
platform = "archived"
note = "licensed; set platform = \"linux\" (or \"windows\"), BENCH_GPT_BIN and GPTLICENSE in bench.local.toml on a machine that has it"
timeout = 7200
