name: Tier 0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tier0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Tier 0 (no simulation code)
        run: pytest -m tier0 -v
