# Bmad-X, the torch tracker of the Bmad family.  Paper setup: python 3.14.9, torch 2.14.1, numpy 2.5.4, last commit of the
# Bmad-X repository 563c825 (20 June 2024).  Its tracks run on the CPU in the benchmark.
name: ssv-bmadx
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - numpy
  - scipy
  - pyyaml
  - h5py
  - pytorch-cpu
  - pip
  - git
  - pip:
      - git+https://github.com/bmad-sim/Bmad-X.git@563c825
